name: Refresh nationwide performances

# Collection checkpoints and successful deployment receipts are separate durable artifacts.
on:
  schedule:
    # Korea: primary 04:17; recovery slots 06:47, 12:47, 20:47.
    - cron: '17 19 * * *'
    - cron: '47 21 * * *'
    - cron: '47 3 * * *'
    - cron: '47 11 * * *'
  workflow_dispatch:
    inputs:
      budget:
        description: 'Collection budget in minutes (5-55)'
        required: false
        default: '50'
  # Code changes deploy with the latest collected data instead of the committed baseline.
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read
  actions: read

concurrency:
  # Branch state is isolated, while collectors sharing provider keys remain serialized.
  group: nationwide-performance-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Includes the 55-minute maximum collection, quality checks, deploy, and state uploads.
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Resolve deployment state scope
        id: scope
        run: node scripts/release-state.ts scope
      - name: Restore collection and deployment state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/daily
          # Failed runs may contain the newest resumable collection. Never restore another branch
          # or a fork. The legacy artifact is accepted only on main for a one-way migration.
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" > "$RUNNER_TEMP/state-index.json"
          id=$(node scripts/release-state.ts select-artifact "$RUNNER_TEMP/state-index.json")
          if [ -n "$id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/state.zip"
            unzip -o -q "$RUNNER_TEMP/state.zip" -d data/daily
            echo "Restored state artifact $id."
          else
            echo "No state for this branch; continuing from the committed snapshot."
          fi
      - name: Plan this run
        id: plan
        run: node scripts/release-state.ts plan
      - name: Install dependencies
        if: steps.plan.outputs.deploy == 'true'
        run: npm ci --ignore-scripts
      - name: Install browser for quality checks
        if: steps.plan.outputs.deploy == 'true'
        run: npx playwright install --with-deps chromium
      - name: Collect and build the public snapshot
        if: steps.plan.outputs.collect == 'true'
        env:
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          CULTURE_API_KEY: ${{ secrets.CULTURE_API_KEY }}
          NATIONAL_RUN_BUDGET_MINUTES: ${{ inputs.budget || '50' }}
        run: node --import tsx scripts/run-daily-publish.ts
      - name: Prepare the exact snapshot for deployment
        if: steps.plan.outputs.deploy == 'true'
        run: node scripts/release-state.ts prepare
      - name: Save resumable collection before deployment
        if: always() && steps.plan.outputs.deploy == 'true' && (hashFiles('data/daily/production.db') != '' || hashFiles('data/daily/public-snapshot.json') != '' || hashFiles('data/daily/collect/collection.db') != '')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.scope.outputs.artifact }}-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/daily
          retention-days: 7
          if-no-files-found: error
      - name: Verify release quality
        if: steps.plan.outputs.deploy == 'true'
        run: npm run quality
      - name: Preserve release quality evidence
        if: always() && steps.plan.outputs.deploy == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Deploy to Vercel
        id: deploy
        if: steps.plan.outputs.deploy == 'true'
        timeout-minutes: 12
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Add the VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID repository secrets to deploy."
            exit 1
          fi
          args=(deploy --yes)
          if [ "$GITHUB_REF" = refs/heads/main ]; then args+=(--prod); fi
          npx --yes vercel@64.0.2 "${args[@]}"
      - name: Acknowledge successful deployment
        id: acknowledge
        if: steps.deploy.outcome == 'success'
        run: node scripts/release-state.ts acknowledge
      - name: Save successful deployment receipt
        if: steps.acknowledge.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.scope.outputs.artifact }}-final-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/daily
          retention-days: 7
          if-no-files-found: error
