<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17323e">
  <meta name="description" content="전국 공연 검색, 지역 체크, 지도 탐색과 자동 갱신. Culture Desk 소개 영상을 보고 공연을 찾아보세요.">
  <title>Culture Desk · 서비스 소개</title>
  <style>
    :root{color-scheme:light;--ink:#17323e;--teal:#176f65;--paper:#f7f8f4;--line:#dce5df}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif;line-height:1.6}
    a{color:inherit;text-underline-offset:4px}a:focus-visible,video:focus-visible{outline:3px solid #ef9566;outline-offset:5px}
    .wrap{width:min(1120px,calc(100% - 48px));margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:26px 0;border-bottom:1px solid var(--line)}
    .brand{font-size:21px;font-weight:750;text-decoration:none;letter-spacing:-.6px}.back{font-size:14px;padding:10px 0}main{padding:44px 0 50px}
    .eyebrow{font-size:12px;letter-spacing:2px;color:var(--teal);font-weight:750;margin:0 0 12px}h1{font-size:clamp(28px,4vw,44px);line-height:1.25;letter-spacing:-1.6px;margin:0 0 14px}
    .intro{font-size:16px;color:#546c72;margin:0 0 28px}.player{overflow:hidden;border-radius:18px;border:1px solid #304a51;background:var(--ink);box-shadow:0 24px 70px #17323e19}
    video{display:block;width:100%;aspect-ratio:16/9;background:var(--ink)}.caption{font-size:13px;color:#61767a;margin:12px 0 28px}
    .actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:11px 23px;border-radius:9px;border:1px solid var(--line);background:white;font-size:15px;font-weight:650;text-decoration:none;white-space:nowrap}
    .primary{background:var(--teal);border-color:var(--teal);color:white}.button:hover{filter:brightness(.95)}footer{padding:20px 0 32px;border-top:1px solid var(--line);font-size:13px;color:#61767a}
    @media(max-width:600px){.wrap{width:calc(100% - 32px)}header{padding:18px 0}.brand{font-size:19px}.back{font-size:13px}main{padding:30px 0}.intro{font-size:14px;word-break:keep-all}.player{border-radius:11px}.actions .button{flex:1;padding:11px 15px}.actions .primary{flex-basis:100%}footer{overflow-wrap:anywhere}}
  </style>
</head>
<body>
  <div class="wrap">
    <header><a class="brand" href="/">Culture Desk</a><a class="back" href="/">공연 검색으로 돌아가기 ↗</a></header>
    <main>
      <p class="eyebrow">CULTURE DESK · INTRODUCTION</p>
      <h1>전국의 공연을, 한눈에.</h1>
      <p class="intro">지역을 체크하고, 지도로 살펴보고, 다음 공연을 만나세요.</p>
      <div class="player">
        <video controls playsinline preload="metadata" poster="/promo/culture-desk-promo-poster.png" aria-label="Culture Desk 서비스 소개 영상. 전국 공연 검색, 지역 선택, 지도 탐색, 자동 갱신 기능을 소개합니다. 음성이 없는 영상입니다.">
          <source src="/promo/culture-desk-promo.mp4" type="video/mp4">
          <p><a href="/promo/culture-desk-promo.mp4">홍보 영상 MP4 내려받기</a></p>
        </video>
      </div>
      <p class="caption">21초 · 음성 없이 볼 수 있는 서비스 소개 영상</p>
      <div class="actions"><a class="button primary" href="/">공연 검색 시작하기 ↗</a><a class="button" href="/#map">지도에서 보기</a><a class="button" href="/promo/culture-desk-promo.mp4" download>MP4 다운로드</a></div>
    </main>
    <footer><a href="https://culture-desk.vercel.app">culture-desk.vercel.app</a> · 전국 주요 공연 검색</footer>
  </div>
</body>
</html>
